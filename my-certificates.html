<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Certificates - Up Skills Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f3f4f6; padding: 40px 20px; color: #111827; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .header h1 { font-size: 28px; font-weight: 700; }
        .header p { color: #6b7280; margin-top: 5px; }
        .student-badge { background: white; padding: 10px 20px; border-radius: 50px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-weight: 600; color: #2563eb; }
        .cert-card { background: white; border-radius: 12px; padding: 20px 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; transition: transform 0.2s; border-left: 5px solid #2563eb; }
        .cert-card:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0,0,0,0.08); }
        .cert-info h3 { font-size: 18px; font-weight: 600; }
        .cert-info p { font-size: 14px; color: #6b7280; margin-top: 4px; }
        .cert-actions { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; font-weight: 500; font-size: 14px; text-decoration: none; cursor: pointer; transition: background 0.2s; border: none; }
        .btn-outline { background: transparent; border: 1px solid #d1d5db; color: #374151; }
        .btn-outline:hover { background: #f3f4f6; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .empty-state { text-align: center; padding: 60px 20px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .empty-state h2 { color: #6b7280; font-weight: 500; }
        @media (max-width: 600px) { .cert-card { flex-direction: column; align-items: flex-start; } .cert-actions { width: 100%; } .cert-actions .btn { flex: 1; text-align: center; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div><h1>🎓 My Certificates</h1><p>View and download your completed program certificates</p></div>
            <!-- The student badge will only show if a name is set -->
            <div class="student-badge" id="studentNameDisplay" style="display:none;">Student: </div>
        </div>
        <div id="certificatesList"><div class="empty-state"><h2>Loading your certificates...</h2></div></div>
    </div>
    <script>
        // ==========================================
        // CONFIGURATION: Set the student name here.
        // Leave it as "" (empty string) to show ALL certificates.
        // Type a name (e.g., "Jane Doe") to show only that student's certs.
        // ==========================================
        const CURRENT_STUDENT_NAME = ""; 

        const API_BASE_URL = 'http://127.0.0.1:5000';

        document.addEventListener('DOMContentLoaded', () => {
            const badge = document.getElementById('studentNameDisplay');
            if (CURRENT_STUDENT_NAME) {
                badge.textContent = `Student: ${CURRENT_STUDENT_NAME}`;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
            loadStudentCertificates();
        });

        async function loadStudentCertificates() {
            const listContainer = document.getElementById('certificatesList');
            try {
                const res = await fetch(`${API_BASE_URL}/api/certificates`);
                const data = await res.json();

                if (data.success && data.certificates) {
                    // Filter logic: If name is empty, show ALL. Otherwise filter by name.
                    let myCerts = data.certificates;
                    if (CURRENT_STUDENT_NAME) {
                        myCerts = data.certificates.filter(cert => 
                            cert.studentName.toLowerCase() === CURRENT_STUDENT_NAME.toLowerCase()
                        );
                    }

                    // Sort by newest first
                    myCerts.sort((a, b) => new Date(b.issueDate) - new Date(a.issueDate));

                    if (myCerts.length === 0) {
                        listContainer.innerHTML = `<div class="empty-state"><h2>📭 No certificates found ${CURRENT_STUDENT_NAME ? 'for ' + CURRENT_STUDENT_NAME : ''}.</h2></div>`;
                        return;
                    }

                    listContainer.innerHTML = myCerts.map(cert => {
                        const date = new Date(cert.issueDate).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                        const downloadUrl = `${API_BASE_URL}/api/certificates/${cert._id}/download`;
                        const verifyUrl = `/verify.html?code=${cert.certificateNumber}`;
                        
                        // Status badge color
                        const statusColor = cert.status === 'revoked' ? '#fee2e2' : '#d1fae5';
                        const statusTextColor = cert.status === 'revoked' ? '#991b1b' : '#065f46';

                        return `
                            <div class="cert-card">
                                <div class="cert-info">
                                    <h3>${cert.courseName}</h3>
                                    <p>Issued: ${date} · ID: ${cert.certificateNumber}</p>
                                    <span style="display:inline-block; margin-top:5px; background:${statusColor}; color:${statusTextColor}; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600;">${cert.status.toUpperCase()}</span>
                                </div>
                                <div class="cert-actions">
                                    <a href="${verifyUrl}" target="_blank" class="btn btn-outline">🔍 Verify</a>
                                    <a href="${downloadUrl}" target="_blank" class="btn btn-success">⬇️ Download PDF</a>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    listContainer.innerHTML = `<div class="empty-state"><h2>❌ Error loading certificates.</h2></div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                listContainer.innerHTML = `<div class="empty-state"><h2>⚠️ Could not connect to server at ${API_BASE_URL}.</h2></div>`;
            }
        }
    </script>
</body>
</html>
